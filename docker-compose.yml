version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: radience_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: radience_user
      POSTGRES_PASSWORD: radience_pass
      POSTGRES_DB: radience_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radience_user -d radience_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - radience_network

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: radience_api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://radience_user:radience_pass@postgres:5432/radience_db
      UPLOAD_DIR: /uploads
      NODE_ENV: production

    ports:
      - "5000:5000"

    volumes:
      - D:/radience-storage/uploads:/uploads

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - radience_network

volumes:
  postgres_data:

networks:
  radience_network:
    driver: bridge