version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: radience_user
      POSTGRES_PASSWORD: radience_pass
      POSTGRES_DB: radience_db
    ports:
      - '5432:5432'
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U radience_user -d radience_db']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://radience_user:radience_pass@postgres:5432/radience_db
      UPLOAD_DIR: /uploads
    ports:
      - '5000:5000'
    volumes:
      - D:/capnero-storage/uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  crm_pgdata:
    driver: local
